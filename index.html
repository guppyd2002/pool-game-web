<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hustle Pool" />
    <title>Hustle Pool</title>
    <script>
      // Phase 1 / 0-A: ?layoutProbe=1 → independent probe page (does not load the game).
      (function () {
        try {
          if (new URLSearchParams(location.search).get('layoutProbe') === '1') {
            location.replace('/layout-probe.html' + location.search + location.hash);
          }
        } catch (_) { /* ignore */ }
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }

      /* Landscape UX: left-hand mode flips power ↔ spin gutters (Phase 1 #4 vars) */
      #app.left-hand-mode .power-slider-overlay {
        left: max(4px, env(safe-area-inset-left, 0px)) !important;
        right: auto !important;
        max-width: calc(var(--gutter-left, 80px) - 8px) !important;
      }
      #app.left-hand-mode .spin-disc-overlay {
        left: calc(var(--felt-left, 0px) + var(--felt-width, 100%) + 4px) !important;
        right: auto !important;
        max-width: calc(var(--gutter-right, 80px) - 8px) !important;
      }

      /* SP-Harden-3 / 3b: short landscape — shrink chrome; enlarge side legends */
      @media screen and (orientation: landscape) and (max-height: 440px) {
        .power-slider-overlay {
          transform: translateY(-50%) scale(0.82) !important;
          transform-origin: left center !important;
        }
        .spin-disc-overlay {
          transform: translateY(-50%) scale(0.82) !important;
          transform-origin: left center !important;
        }
        /* Counter scale-down: keep POWER/SPIN readable at 390px height */
        .hud-side-label {
          font-size: 14px !important;
          letter-spacing: 2px !important;
        }
        #player-ball-hud {
          padding-top: 2px !important;
          padding-bottom: 2px !important;
        }
      }

      /* Rotate-device prompt — shown only in portrait on mobile */
      #rotate-prompt {
        display: none;
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a1a;
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        gap: 16px;
        text-align: center;
        padding: max(32px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(32px, env(safe-area-inset-left, 0px));
        box-sizing: border-box;
      }
      #rotate-prompt .rotate-icon { font-size: 64px; }
      @media screen and (orientation: portrait) and (max-width: 900px) {
        #rotate-prompt { display: flex; }
      }

      /* SET-008: game-over / banners stay inside safe area on notched devices */
      #game-over-ui, #reason-banner, #turn-prompt, #settings-panel {
        box-sizing: border-box;
      }
      #main-menu {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="rotate-prompt">
      <div class="rotate-icon">📱↻</div>
      <div style="font-size:18px;font-weight:bold;">Please rotate your device</div>
      <div style="font-size:14px;opacity:0.6;">Hustle Pool plays in landscape mode</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
